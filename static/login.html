<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBAC Gateway &mdash; Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-full flex items-center justify-center bg-gray-950 font-mono">

  <div class="w-full max-w-sm px-4">

    <!-- Logo + title -->
    <div class="flex flex-col items-center mb-8">
      <div class="flex items-center justify-center w-14 h-14 rounded-2xl
                  bg-indigo-600/20 border border-indigo-500/40 mb-4">
        <svg class="w-7 h-7 text-indigo-400" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 2l7 4v5c0 5-3.5 9.74-7 11C8.5 20.74 5 16 5 11V6l7-4z"/>
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-white tracking-tight">
        Zero-Trust API Gateway
      </h1>
      <p class="text-xs text-gray-500 mt-1">Context-Based Access Control</p>
    </div>

    <!-- Card -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">

      <h2 class="text-sm font-semibold text-gray-300 uppercase tracking-widest mb-6">
        Admin Sign In
      </h2>

      <!-- Error banner (hidden by default) -->
      <div id="error-banner"
           class="hidden mb-4 rounded-lg bg-red-900/40 border border-red-700
                  px-4 py-3 text-xs text-red-300">
        <span id="error-text">Invalid credentials.</span>
      </div>

      <form id="login-form" class="space-y-4" autocomplete="off">

        <div>
          <label class="block text-xs text-gray-400 mb-1.5" for="username">
            Username
          </label>
          <input
            id="username" name="username" type="text"
            placeholder="demo  or  alice"
            required
            class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-2.5
                   text-sm text-white placeholder-gray-600
                   focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500
                   transition"
          />
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1.5" for="password">
            Password
          </label>
          <input
            id="password" name="password" type="password"
            placeholder="demo1234  or  alice1234"
            required
            class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-2.5
                   text-sm text-white placeholder-gray-600
                   focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500
                   transition"
          />
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full mt-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700
                 px-4 py-2.5 text-sm font-semibold text-white
                 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2
                 focus:ring-offset-gray-900 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Sign In
        </button>

      </form>

      <!-- Demo credentials hint -->
      <div class="mt-6 rounded-lg bg-gray-800/60 border border-gray-700/50 px-4 py-3">
        <p class="text-xs text-gray-500 font-semibold uppercase tracking-widest mb-2">
          Demo credentials
        </p>
        <div class="space-y-1 text-xs text-gray-400">
          <div class="flex justify-between">
            <span class="text-indigo-400">demo</span>
            <span class="text-gray-500">demo1234</span>
          </div>
          <div class="flex justify-between">
            <span class="text-indigo-400">alice</span>
            <span class="text-gray-500">alice1234</span>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // If already logged in, skip to dashboard
    if (localStorage.getItem('cbac_token')) {
      window.location.href = '/admin/dashboard';
    }

    const form       = document.getElementById('login-form');
    const submitBtn  = document.getElementById('submit-btn');
    const errorBanner = document.getElementById('error-banner');
    const errorText  = document.getElementById('error-text');

    function showError(msg) {
      errorText.textContent = msg;
      errorBanner.classList.remove('hidden');
    }

    function hideError() {
      errorBanner.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const resp = await fetch('/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password }),
        });

        if (resp.ok) {
          const data = await resp.json();
          localStorage.setItem('cbac_token',    data.access_token);
          localStorage.setItem('cbac_username', data.username);
          localStorage.setItem('cbac_user_id',  data.user_id);
          window.location.href = '/admin/dashboard';
        } else {
          const err = await resp.json().catch(() => ({}));
          showError(err.detail || 'Invalid username or password.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      } catch {
        showError('Cannot reach the server. Is it running?');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>

</body>
</html>
